<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Matchday Edge: Football prediction web app (mobile-first PWA) featuring Dixon-Coles Poisson model, Negative Binomial corners & cards, and full Sporty Bet-style markets." />
    <link rel="manifest" href="/manifest.json" />
    <title>Matchday Edge | Football Predictions & Live Analysis</title>
  </head>
  <body class="bg-gray-950 text-gray-100 min-h-screen selection:bg-sporty-green selection:text-black antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
